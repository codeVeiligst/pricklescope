[global_tags]
  environment = "development"
  collector = "telegraf"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  # Sized against a stated outage tolerance rather than left at the default.
  # At the documented medium tier — 500 sources, 48 interfaces — one poll is
  # roughly 49,000 metrics, so the old 10,000 was a fifth of a single wave and a
  # momentary QuestDB stall dropped samples immediately (audit F5). This holds
  # about two minutes of a medium fleet. It is memory, not disk: anything longer
  # needs durable spooling, which this project does not have, and
  # operations.md now says so rather than implying the buffer covers an outage.
  metric_buffer_limit = 100000
  # Spread the wave. With no jitter every input fires on the same tick, so the
  # SNMP burst, the CPU spike, and the ingest burst all land together — and the
  # buffer sees the whole fleet at once instead of a fifth of it.
  collection_jitter = "5s"
  flush_interval = "5s"
  flush_jitter = "2s"
  precision = "1ms"
  hostname = "telegraf-dev"
  omit_hostname = false
  snmp_translator = "gosmi"
  skip_processors_after_aggregators = false

# Nothing is collected here. Both inputs that used to live in this file —
# `internal` and `mem` — wrote measurements the line protocol created implicitly,
# so the retention reconciler never knew about them and their tables grew without
# limit. Collector health is now rendered into the managed configuration as
# `collector_health`, which the controller owns and expires. There is nothing left
# for a bootstrap stream to prove that the managed configuration does not.

# Prometheus Remote Write ingest. Nothing in the development stack writes to it
# since the Alloy collector was dropped (D-024), but it is the TCP port the
# controller's Telegraf liveness probe connects to, and it keeps the relay path
# open for anything that speaks Remote Write.
[[inputs.http_listener_v2]]
  service_address = ":1234"
  paths = ["/api/v1/write"]
  methods = ["POST"]
  data_format = "prometheusremotewrite"

  [inputs.http_listener_v2.tags]
    relay = "remote_write"

# QuestDB accepts the InfluxDB v2 output's ILP payload over HTTP. Authentication
# is intentionally omitted for this loopback-only development stack.
[[outputs.influxdb_v2]]
  urls = ["http://questdb:9000"]
  timeout = "15s"
  content_encoding = "gzip"
