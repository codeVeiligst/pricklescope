name: ${COMPOSE_PROJECT_NAME:-pricklescope-dev}

services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricklescope}
      POSTGRES_USER: ${POSTGRES_USER:-pricklescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - monitoring

  questdb:
    image: questdb/questdb:9.4.3@sha256:3fd139f9f16015afc1b064fe4591b271be26cdec10315415e5511e9d80a5919e
    restart: unless-stopped
    environment:
      QDB_METRICS_ENABLED: 'true'
      QDB_PG_USER: ${QUESTDB_CONTROLLER_USER:-pricklescope_controller}
      QDB_PG_PASSWORD: ${QUESTDB_CONTROLLER_PASSWORD:?Set QUESTDB_CONTROLLER_PASSWORD in infra/.env}
      QDB_PG_READONLY_USER_ENABLED: 'true'
      QDB_PG_READONLY_USER: ${QUESTDB_GRAFANA_USER:-grafana}
      QDB_PG_READONLY_PASSWORD: ${QUESTDB_GRAFANA_PASSWORD:?Set QUESTDB_GRAFANA_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:${QUESTDB_HTTP_PORT:-9000}:9000'
      - '127.0.0.1:${QUESTDB_PG_PORT:-8812}:8812'
      - '127.0.0.1:${QUESTDB_HEALTH_PORT:-9003}:9003'
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9003/ >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - monitoring

  telegraf:
    image: telegraf:1.39.2-alpine@sha256:cd926aecf11809ffe1b6125a752dd22a4336e150f061bcc202f74b46b785817d
    restart: unless-stopped
    user: '${TELEGRAF_UID:-1000}:${TELEGRAF_GID:-1000}'
    depends_on:
      questdb:
        condition: service_healthy
    ports:
      - '127.0.0.1:${TELEGRAF_REMOTE_WRITE_PORT:-1234}:1234'
    cap_add:
      - NET_RAW
    command:
      - --config
      - /etc/telegraf/telegraf.conf
      - --config-directory
      - /etc/telegraf/runtime/active
      - --watch-config
      - poll
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      # The controller writes here and Telegraf watches it. A second stack on the
      # same host must point somewhere else or the two overwrite each other.
      - ${PRICKLESCOPE_TELEGRAF_RUNTIME_DIR:-./runtime/telegraf}:/etc/telegraf/runtime:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    restart: unless-stopped
    depends_on:
      questdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infra/.env}
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_ROOT_URL:-http://localhost:5173/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ALLOW_EMBEDDING: 'false'
      GF_SECURITY_CONTENT_SECURITY_POLICY: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_SIGNOUT_MENU: 'true'
      GF_AUTH_PROXY_ENABLED: 'true'
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_PROXY_SYNC_TTL: '0'
      GF_AUTH_PROXY_WHITELIST: ${GRAFANA_AUTH_PROXY_WHITELIST:-127.0.0.1,172.16.0.0/12}
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_PLUGINS_PREINSTALL_SYNC: questdb-questdb-datasource@0.1.8
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000'
    # Email contact points are webhooks aimed back at the controller (D-023), so
    # Grafana must be able to resolve the API host from inside the container.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://localhost:3000/grafana/api/health
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  postgres-data:
  questdb-data:
  grafana-data:
