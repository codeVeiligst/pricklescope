# Project rules for PrickleScope.
#
# The community rulesets turned out to be nearly inert on this codebase — 79 of
# them ran against a file containing `eval(userInput)` and a shell injection and
# reported nothing, and the free registry says as much when it suggests logging in
# for more. They are still run, because they cost nothing and catch configuration
# drift, but they are not the check.
#
# These are. Each one encodes a sink this codebase actually has, most of them
# learned from a real finding during the Milestone 9 review.

rules:
  - id: pricklescope-toml-raw-interpolation
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - packages/adapters/src/telegraf.ts
    message: >-
      A value is interpolated into rendered Telegraf configuration without
      string() or comment(). A TOML comment is not quoted and a newline ends it,
      which is how a source name once rendered a real [[inputs.exec]] and ran
      commands on the collector host. Wrap it.
    patterns:
      # Every interpolation on a comment line must go through comment(); an id
      # generated by the controller is allowed through by name.
      - pattern-regex: '`#[^`]*\$\{(?!comment\(|check\.sourceId|check\.checkId)[a-zA-Z]'

  - id: pricklescope-no-child-process
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      exclude:
        - '*.test.ts'
        - scripts/**
    message: >-
      The controller does not run subprocesses. Collection happens in Telegraf,
      which is configured through generated files, not invoked. If this is really
      needed, it belongs in the threat model first.
    pattern-either:
      - pattern: require('child_process')
      - pattern: require('node:child_process')
      - pattern-regex: "from\\s+['\"]node:child_process['\"]"
      - pattern-regex: "from\\s+['\"]child_process['\"]"

  - id: pricklescope-no-dynamic-evaluation
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      exclude:
        - '*.test.ts'
    message: Dynamic evaluation turns any input that reaches it into code.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: setTimeout("...", ...)

  - id: pricklescope-no-tls-bypass
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      TLS verification is being switched off. The controller talks to an identity
      provider, mail providers, and operator webhooks over TLS; skipping
      verification makes each of those interceptable.
    pattern-either:
      - pattern: 'rejectUnauthorized: false'
      - pattern-regex: 'NODE_TLS_REJECT_UNAUTHORIZED'
      - pattern: 'strictSSL: false'

# Three rules were written, run, and removed rather than kept:
#
#   sql-template-interpolation    matched a benchmark CLI and a constant table
#                                 list. Parameterisation is verified instead by
#                                 the injection cases in
#                                 apps/api/tests/security/adversarial.test.ts and
#                                 by review of every pool.query call.
#   route-without-guard           cannot tell a deliberately public route from a
#                                 forgotten one, and flagged all four of the
#                                 public ones. The authorization matrix in
#                                 apps/api/tests/security/authorization.test.ts
#                                 already fails when a route has no stated access
#                                 level, which is the real check.
#   secret-in-response-schema     matched request schemas, where those fields
#                                 belong. What matters is whether a secret comes
#                                 back, and disclosure.test.ts asserts that
#                                 against the running application with planted
#                                 values.
#
# Each was noisier than it was useful, and a rule that cries wolf is one people
# learn to skip past — which costs more than not having it.
