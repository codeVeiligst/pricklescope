# Builds and publishes the release images for a version tag.
#
# Only a `v*` tag starts this, and tag creation is the approval step — which is
# why the tag pattern should be protected in repository settings. A pull request
# cannot reach this workflow, so a fork cannot reach the registry credential.
#
# `id-token: write` is for keyless signing: cosign gets a short-lived certificate
# from the workflow's OIDC identity, so there is no signing key to store or leak.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: pricklescope
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: pricklescope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pricklescope -d pricklescope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pricklescope:ci-only-not-a-secret@localhost:5432/pricklescope_test
      PRICKLESCOPE_DATABASE_URL: postgresql://pricklescope:ci-only-not-a-secret@localhost:5432/pricklescope_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # security-scan.sh scans the commit history for secrets, and the
          # default shallow clone has none to scan — the check would pass by
          # having nothing to look at. CI's own scan job already does this.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Off deliberately: this action detects `packageManager` in
          # package.json and runs pnpm to find its store, which fails because
          # corepack has not run yet — and corepack cannot run first, since
          # this step replaces the Node whose bin directory holds the shims.
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: corepack pnpm build

      # Nothing is published until every check a pull request faces has passed
      # against the tagged commit itself.
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm typecheck
      - run: corepack pnpm docs:check
      - run: corepack pnpm test
      - run: corepack pnpm test:integration
      - run: corepack pnpm test:security
      - run: ./scripts/security-scan.sh
      - run: ./scripts/scan.sh

      # The browser suite and the container-image checks need a whole stack, and
      # duplicating those jobs here would mean two copies to keep in step. This
      # requires the pull-request pipeline to have already passed for *this exact
      # commit* instead — which is what the gate always claimed to guarantee and
      # did not: it omitted formatting, documentation and end-to-end entirely, so
      # a directly tagged commit could publish with any of them broken (audit F7).
      - name: The pull-request pipeline must have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "missing"')
          echo "CI for ${GITHUB_SHA}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed for ${GITHUB_SHA} (${conclusion}). Push the commit, let CI finish, then tag it."
            exit 1
          fi

      - name: The tag must match the declared version
        run: |
          declared=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $declared"
            exit 1
          fi
          echo "version $declared"

          # The apps and packages are private and never published, so nothing
          # else would notice them drifting away from the root — and a package
          # claiming a version that was never released is a lie in an artifact
          # someone may read.
          for f in packages/*/package.json apps/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$declared" ]; then
              echo "::error::$f is $v, not $declared"
              exit 1
            fi
          done
          echo "all workspace packages agree"

      # Here rather than where the notes are written, which is after the images
      # have been pushed. A gate that fires after publishing is not a gate.
      - name: The changelog must describe this version
        run: |
          ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" "${GITHUB_SHA}" \
            "${GITHUB_REPOSITORY}" sha256:0 sha256:0 > /dev/null

  publish:
    name: Build, sign, and publish
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its notes
      packages: write # ghcr
      id-token: write # keyless signing, no stored key
      attestations: write # build provenance
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry path must be lowercase; an owner or repository name need not
      # be. `docker/metadata-action` lowercases on its own, so the build and push
      # worked while every hand-written reference to the same image did not — the
      # v0.1.0 release failed here, at `cosign sign`, after publishing. Deriving
      # the name once removes the chance for two spellings to disagree.
      #
      # GITHUB_REPOSITORY keeps its original case where an identity is meant
      # rather than an address: the OIDC certificate records the repository as
      # GitHub spells it.
      - name: Image name
        run: echo "IMAGES=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Two images, because the documented architecture has two: the gateway
      # serves the built SPA, so the frontend is not a separate runtime image.
      - name: API tags
        id: api-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGES }}/api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and push the API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Gateway tags
        id: web-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGES }}/web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and push the gateway image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Sign the images
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - run: |
          cosign sign --yes "${IMAGES}/api@${{ steps.api.outputs.digest }}"
          cosign sign --yes "${IMAGES}/web@${{ steps.web.outputs.digest }}"

      - name: Software bill of materials
        run: ./scripts/sbom.sh "${GITHUB_WORKSPACE}/sbom"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

      # The body is a script so it can be read and run before a tag is cut. The
      # first v0.1.0 notes carried the digests and nothing else — no
      # installation, no limitations, no security summary — and that was only
      # visible after the release had been drafted.
      - name: Record what was published
        run: |
          ./scripts/release-notes.sh \
            "${GITHUB_REF_NAME#v}" \
            "${GITHUB_SHA}" \
            "${GITHUB_REPOSITORY}" \
            "${{ steps.api.outputs.digest }}" \
            "${{ steps.web.outputs.digest }}" > release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-body.md
          files: sbom/*.cdx.json
          draft: true
          generate_release_notes: true
